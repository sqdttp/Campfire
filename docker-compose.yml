services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guide_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-guide_cluster}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-guide}:${POSTGRES_PASSWORD:-guide_dev_password}@db:5432/${POSTGRES_DB:-guide_cluster}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-guide}:${POSTGRES_PASSWORD:-guide_dev_password}@db:5432/${POSTGRES_DB:-guide_cluster}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
