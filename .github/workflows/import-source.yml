name: Import Campfire source

on:
  push:
    branches:
      - main
    paths:
      - Campfire-source.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract repository
        run: |
          unzip -o Campfire-source.zip
          rm Campfire-source.zip
          rm .github/workflows/import-source.yml
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import initial Campfire backend"
          git push
